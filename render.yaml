services:
  - type: web
    name: portfolio-backend
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: VITE_API_URL
        value: /api
      - key: VITE_CLIENT_URL
        value: https://chetanpawar-portfolio-using-react.onrender.com
      - key: CLIENT_URL
        value: https://chetanpawar-portfolio-using-react.onrender.com
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
